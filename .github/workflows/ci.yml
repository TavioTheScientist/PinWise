name: CI

# Builds and tests Staxyz. Both domain cores (Swift and its Dart port) are platform-agnostic and
# run on cheap Linux runners (1× minutes); only the iOS app build needs macOS + Xcode
# (10× minutes), so we keep that job as lean as possible.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "App/design/**", "RefImages/**", "feed/**"]
  pull_request:
    paths-ignore: ["**.md", "App/design/**", "RefImages/**", "feed/**"]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref — saves minutes during
# iterative pushes (the biggest recurring drain).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-core:
    name: Domain core (PeptideKit)
    runs-on: ubuntu-latest          # 1× minutes (was macOS = 10×); PeptideKit is Foundation-only
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Verify dosing math (assertion harness)
        working-directory: App
        run: swift run pk-verify
      - name: Run test suite
        working-directory: App
        run: swift test

  dart-core:
    name: Domain core (Dart port)
    # 1× minutes, and needs no simulator — verifying anywhere is the whole point of porting
    # this layer before any UI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # `stable`, not a pinned patch: the package declares `sdk: ^3.9.0` and pinning an exact
          # version breaks CI whenever that build is retired. If a stable release ever breaks the
          # build, pin here deliberately rather than loosening the analyzer.
          sdk: stable
      - name: Resolve dependencies
        working-directory: AndroidApp/peptide_kit
        run: dart pub get
      - name: Analyze
        working-directory: AndroidApp/peptide_kit
        # --fatal-infos because the package is currently clean at info level, and the cheapest
        # time to keep it that way is now.
        run: dart analyze --fatal-infos
      - name: Check formatting
        working-directory: AndroidApp/peptide_kit
        run: dart format --output=none --set-exit-if-changed .
      # Same order as the Swift job: the assertion harness first, then the suites. It is the
      # artifact whose check COUNT is tracked against the Swift's, so a drop is visible here.
      - name: Verify dosing math (assertion harness)
        working-directory: AndroidApp/peptide_kit
        run: dart run tool/pk_verify.dart
      - name: Run test suite (ports of the Swift suites)
        working-directory: AndroidApp/peptide_kit
        run: dart test

  ios-app:
    name: Build iOS app
    # macos-26, raised from macos-15 alongside the iOS 26 deployment target. The macos-15 image
    # ships Xcode 16.4 — the iOS 18 SDK — which cannot compile `glassEffect`, `Tab(…, role:)` or
    # `tabBarMinimizeBehavior`, so it failed the moment the app adopted Liquid Glass. The Xcode
    # selection is EXPLICIT rather than left to the image default: a runner-image update that moves
    # the default would otherwise change the SDK under the build silently.
    runs-on: macos-26               # 10× minutes — unavoidable (needs Xcode + iOS SDK)
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'iphonesimulator' || true
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('App/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate
      - name: Build (iOS Simulator)
        working-directory: App
        run: |
          xcodebuild build \
            -project Staxyz.xcodeproj \
            -scheme Staxyz \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO
