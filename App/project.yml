# XcodeGen spec — generates the Staxyz iOS app project with one command.
#   brew install xcodegen   # if needed
#   cd App && xcodegen generate && open Staxyz.xcodeproj
# The app links the local PeptideKit package (this same directory) and compiles the
# SwiftUI sources under iOSApp/. Keeps the manual-setup steps in iOSApp/README.md optional.
name: Staxyz
options:
  bundleIdPrefix: com.staxyz
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  PeptideKit:
    path: .
  # Supabase Swift SDK — used for auth only (Apple id-token sign-in, anonymous guest sessions,
  # token refresh). The AI streaming call is hand-rolled over URLSession in CloudAIClient, since
  # the SDK's function-invoke doesn't stream SSE.
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

targets:
  Staxyz:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
        excludes:
          - "**/*.md"
    # XcodeGen GENERATES a complete Info.plist here (CFBundleIdentifier, CFBundleExecutable,
    # versions, package type, ...) and merges in these custom keys. Do not hand-edit the file.
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Staxyz
        # Launch: metallic PW icon tile on PURE BLACK + Staxyz wordmark (no glow — founder removed it).
        # Config must live HERE — xcodegen regenerates Info.plist. Bumping the storyboard filename
        # (V12 = black bg, no glow) is a fresh launch-snapshot cache key.
        UILaunchStoryboardName: LaunchScreenV12
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Staxyz displays the weight, resting heart rate, HRV, sleep, and step values you choose to share from Health alongside your dose logs."
        NSCameraUsageDescription: "Staxyz uses the camera so you can photograph a vial label or take a progress photo. Photos stay on your device."
        NSMicrophoneUsageDescription: "Staxyz uses the microphone so you can speak a vial's details to fill them in. Audio is transcribed on your device and isn't uploaded."
        NSSpeechRecognitionUsageDescription: "Staxyz transcribes your speech on your device to fill in vial details. Nothing is sent to Apple or any server."
        NSFaceIDUsageDescription: "Staxyz uses Face ID to lock the app, so only you can open it. This is optional and off by default."
    # HealthKit read access (weight, resting HR, HRV). XcodeGen generates the entitlements
    # file; the usage string lives in info.NSHealthShareUsageDescription above.
    entitlements:
      path: iOSApp/Staxyz.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Sign in with Apple (native, no backend). Google/Email sign-in route through
        # AuthManager and require a backend + Google client ID to complete.
        com.apple.developer.applesignin:
          - Default
        # Time Sensitive notifications: dose reminders are marked .timeSensitive so they
        # pierce Focus / Do Not Disturb / silent mode and surface prominently on the lock
        # screen. Without this entitlement, .timeSensitive silently degrades to .active.
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - package: PeptideKit
        product: PeptideKit
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.staxyz.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        # App icon: single 1024 asset per appearance (Light / Dark / Tinted) in
        # iOSApp/Assets.xcassets/AppIcon.appiconset — iOS picks the slot to match the
        # user's home-screen style. Source SVGs live in App/design/AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App target uses Swift 5 language mode to avoid strict-concurrency friction during
        # early iteration; PeptideKit stays on Swift 6. Bump to "6.0" once the UI settles.
        SWIFT_VERSION: "5.0"
      configs:
        # DEBUG ONLY. HealthKit WRITE access needs its own usage string, and requesting share
        # authorization without one raises an ObjC exception that kills the app. Only the
        # screenshot seeder (iOSApp/Debug/DebugSeeder.swift, entirely `#if DEBUG`) ever writes —
        # HealthManager is read-only and stays that way.
        #
        # It lives here, as an INFOPLIST_KEY_ build setting on the Debug configuration, rather than
        # in `info.properties` above: properties there are unconditional and would ship a
        # write-permission declaration in the release build, putting a "Staxyz can write your health
        # data" row in every real user's Health settings for a capability the app does not have.
        # A Release build therefore has no such key — which is exactly why the seeder checks for it
        # before asking.
        #
        # GENERATE_INFOPLIST_FILE must be ON for INFOPLIST_KEY_ settings to be honored at all — with
        # an explicit INFOPLIST_FILE the build system uses that file as the BASE and merges the
        # INFOPLIST_KEY_ values into it. Without this line the key is silently dropped (verified:
        # the built plist simply had no NSHealthUpdateUsageDescription).
        debug:
          # DEBUG BUILDS USE THE OLD BUNDLE ID, AND THIS IS THE POINT — not an oversight.
          #
          # Sign in with Apple is a per-BUNDLE-ID grant. `com.pinwise.app` holds a cached grant on the
          # local simulator (`authorization.db`, credential_state = 1) from when the app shipped under
          # that name; `com.staxyz.app` has none, and Apple will not mint a fresh one because there is
          # no Apple Developer account, so no registered App ID. A ⌘R build under the new id therefore
          # CANNOT log in — it fails as `M2 missing (bad password)` / `Invalid client.`, which reads
          # like a credential problem and is not one.
          #
          # Pointing DEBUG at the id that has the grant means ⌘R produces an app that can actually sign
          # in, and there is exactly one Staxyz icon on the device instead of one that works and one
          # that cannot. Release is untouched below and still ships `com.staxyz.app`, so nothing about
          # the shipping identity changes — which is the distinction that matters. The old warning
          # ("never commit the bundle override") was about overriding the SHIPPING id; scoping it to
          # the Debug configuration is the opposite of that.
          #
          # REMOVE THIS the moment the Developer account exists and `com.staxyz.app` has a registered
          # App ID with the Sign In with Apple capability — at that point debug should exercise the
          # real identity, and leaving this in would hide a genuine problem.
          #
          # Supabase already lists BOTH ids in `external_apple_client_id`, so the token exchange
          # validates either way and lands on the same user.
          PRODUCT_BUNDLE_IDENTIFIER: com.pinwise.app
          GENERATE_INFOPLIST_FILE: "YES"
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: "DEBUG builds only: the screenshot seeder writes sample weight, heart-rate, HRV, sleep and step data so the app can be photographed with realistic history."

  # Host-app unit tests for the parts of the app that can't live in PeptideKit. Today that is the
  # StoreKit 2 subscription flow, which needs a real store to talk to: `SKTestSession` loads
  # Staxyz.storekit programmatically and can expire or refund a transaction, so purchase / restore
  # / expiry are verifiable headlessly. The scheme's storeKitConfiguration below only applies to
  # the RUN action in Xcode, which is why this target ships the file as its OWN resource.
  #
  # Local-only on purpose: NOT in the scheme's build action, so `xcodebuild build -scheme Staxyz`
  # (the CI gate) neither builds nor runs it. CI's runner has no iOS 26 simulator.
  StaxyzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSAppTests
      - path: Staxyz.storekit
        buildPhase: resources
    dependencies:
      - target: Staxyz
      - package: PeptideKit
        product: PeptideKit
    settings:
      base:
        # Matches the app target — `@testable import Staxyz` compiles against its module.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

# Explicit shared scheme so CI (`xcodebuild -scheme Staxyz`) works headlessly.
schemes:
  Staxyz:
    build:
      targets:
        Staxyz: all
    run:
      config: Debug
      # Local StoreKit testing WITHOUT App Store Connect products existing yet. With this
      # attached, the simulator serves the two subscriptions from Staxyz.storekit, so the paywall,
      # purchase, restore and expiry paths are all exercisable now. Xcode's Debug ▸ StoreKit
      # ▸ Manage Transactions pane can then expire/refund a purchase on demand.
      #
      # This affects the Debug RUN action only — it is not compiled into the app, so a release
      # build still talks to the real App Store. The product IDs here MUST stay identical to
      # SubscriptionManager.ProductID and to the eventual App Store Connect products; a mismatch
      # fails silently (products just don't load).
      storeKitConfiguration: Staxyz.storekit
    test:
      config: Debug
      # No storeKitConfiguration here: XcodeGen only emits that reference for the RUN action, and
      # StaxyzTests does not need it — it builds its own SKTestSession from the copy of
      # Staxyz.storekit in its resources, which is what gives it expire/refund control anyway.
      targets:
        - StaxyzTests
